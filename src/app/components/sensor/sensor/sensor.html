<mat-card class="sensor-component" [ngClass]="{'error': sensor.error}">
  <mat-card-header>
    <div mat-card-avatar class="sensor-image">
      <mat-icon
        class="material-symbols-outlined"
        [fontIcon]="SensorType.getIconName(getSensorTypeName(sensor.typeId))"
      ></mat-icon>
    </div>
    <mat-card-title-group class="sensor-title-group">
      <div class="sensor-details">
        <mat-card-title>{{sensor.name}}</mat-card-title>
        @if (sensor.zigbeeDeviceId != null && zigbeeDevice) {
        <mat-card-subtitle>
          <mat-icon class="material-symbols-outlined" aria-label="Wireless sensor">wifi</mat-icon>
          <span>{{ zigbeeDevice.name || zigbeeDevice.ieeeAddress }}</span>
        </mat-card-subtitle>
        } @else {
        <mat-card-subtitle>
          <mat-icon class="material-symbols-outlined" aria-label="Wired sensor">label</mat-icon>
          <span>CH{{ sensor.channel + 1 | number: '2.0-0' }}</span>
        </mat-card-subtitle>
        }
      </div>
      <div class="sensor-indicators">
        @if (sensor.tamper != null) {
        <div class="sensor-indicator-group">
          <mat-icon
            class="material-symbols-outlined sensor-indicator-type"
            [fontIcon]="SensorType.getIconName('Tamper')"
            aria-hidden="true"
          ></mat-icon>
          <div
            class="sensor-state"
            [ngClass]="{'enabled': sensor.enabled === true && !sensor.tamper, 'disabled': sensor.enabled === false && !sensor.tamper, 'alerting': sensor.tamper, 'neutral': sensor.enabled == null && !sensor.tamper}"
            role="img"
            aria-label="Tamper sensor state"
            i18n-aria-label="@@sensor tamper state"
          ></div>
        </div>
        }
        <div class="sensor-indicator-group">
          <mat-icon
            class="material-symbols-outlined sensor-indicator-type"
            [fontIcon]="SensorType.getIconName(getSensorTypeName(sensor.typeId))"
            aria-hidden="true"
          ></mat-icon>
          <div
            class="sensor-state"
            [class.error-state]="sensor.error"
            [ngClass]="{'enabled': sensor.enabled === true && (delay != null || sensor.alert), 'disabled': sensor.enabled === false, 'alerting': sensor.alert && sensor.enabled === true, 'neutral': sensor.error === true || !(sensor.enabled === false || (sensor.enabled === true && (delay != null || sensor.alert)))}"
            role="img"
            [attr.aria-label]="sensor.name"
          >
            @if (sensor.error) {
            <mat-icon class="material-symbols-outlined error-icon">error</mat-icon>
            } @if (sensor.enabled && delay > 0) {
            <span class="delay">{{delay}}</span>
            }
          </div>
        </div>
      </div>
    </mat-card-title-group>
  </mat-card-header>
</mat-card>
