<div class="container">
  @if (device && deviceForm) {
    <mat-card class="zigbee-device-form container-item">
      <form [formGroup]="deviceForm" (ngSubmit)="onSubmit()" novalidate class="column">
        <mat-card-content>
          <mat-card-title i18n="@@zigbee device form">Zigbee device</mat-card-title>
          <mat-form-field>
            <mat-label i18n="@@zigbee device name">Name</mat-label>
            <input matInput formControlName="name" required maxlength="12" />
          </mat-form-field>
        </mat-card-content>
        <mat-divider></mat-divider>
        <mat-card-actions align="end">
          <button
            mat-icon-button
            color="primary"
            type="submit"
            [disabled]="
              deviceForm.invalid ||
              deviceForm.pristine ||
              ![monitoringStates.READY, monitoringStates.INVALID_CONFIG].includes(monitoringState)
            "
          >
            <mat-icon class="material-symbols-outlined">save</mat-icon>
          </button>
          <button mat-icon-button color="warn" type="button" (click)="onCancel()" title="Cancel" i18n-title="@@cancel">
            <mat-icon class="material-symbols-outlined">cancel</mat-icon>
          </button>
        </mat-card-actions>
      </form>
    </mat-card>
  }

  @if (device === null) {
    <div class="container-item">
      <h1 i18n="@@zigbee device not found">The Zigbee device was not found!</h1>
    </div>
  }
</div>
