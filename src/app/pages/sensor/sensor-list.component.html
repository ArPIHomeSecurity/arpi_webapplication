@if (sensors != null) {
  <div class="container sensor-list">
    @if (sensors.length > 0) {
      <div cdkDropList (cdkDropListDropped)="onDrop($event)">
        @for (sensor of sensors; track sensor) {
          <app-sensor-card
            id="sensor-{{ sensor.id }}"
            cdkDrag
            (cdkDragStarted)="onDragStarted($event)"
            [cdkDragDisabled]="!userCanEdit()"
            class="container-item"
            [sensor]="sensor"
            [iconName]="SensorType.getIconName(getSensorTypeName(sensor.typeId))"
            [attributeGroups]="getSensorAttributeGroupsById(sensor.id)"
            [canEdit]="userCanEdit()"
            [monitoringState]="monitoringState"
            (resetReferences)="onResetReferences($event)"
            (deleteRequested)="openDeleteDialog($event)"
          ></app-sensor-card>
        }
      </div>
    } @else {
      <div class="sensor-list">
        <h1 class="empty" i18n="@@sensor none">No sensors found</h1>
      </div>
    }
  </div>
}

@if (userCanEdit()) {
  <div class="list-actions">
    <button
      class="list-action"
      mat-fab
      color="accent"
      [disabled]="monitoringState != monitoringStates.READY"
      (click)="onResetReferences()"
    >
      <mat-icon class="material-symbols-outlined">refresh</mat-icon>
    </button>
    <button
      class="list-action"
      mat-fab
      color="accent"
      routerLink="/sensor/add"
      [disabled]="monitoringState != monitoringStates.READY"
    >
      <mat-icon class="material-symbols-outlined">add</mat-icon>
    </button>
    <button
      class="list-action"
      mat-mini-fab
      color="accent"
      [disabled]="monitoringState != monitoringStates.READY"
      (click)="onResetReferences()"
    >
      <mat-icon class="material-symbols-outlined">refresh</mat-icon>
    </button>
    <button
      class="list-action"
      mat-mini-fab
      color="accent"
      routerLink="/sensor/add"
      [disabled]="monitoringState != monitoringStates.READY"
    >
      <mat-icon class="material-symbols-outlined">add</mat-icon>
    </button>
  </div>
}
