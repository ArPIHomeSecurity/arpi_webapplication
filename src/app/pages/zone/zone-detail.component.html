<div class="container">
  @if (zone) {
    <mat-card class="container-item zone-form">
      <mat-card-content>
        <form [formGroup]="zoneForm" (ngSubmit)="onSubmit()" novalidate>
          <app-zone-configuration
            [form]="zoneForm"
            nameLabel="Name"
            i18n-nameLabel="@@name"
            namePlaceholder="Name"
            i18n-namePlaceholder="@@name"
            descriptionControlName="description"
            [showPresets]="zoneId === undefined"
            [selectedPreset]="selectedZonePreset"
            (selectedPresetChange)="selectedZonePreset = $event"
          ></app-zone-configuration>
        </form>
      </mat-card-content>
      <mat-divider></mat-divider>
      <mat-card-actions align="end">
        <button
          mat-icon-button
          color="primary"
          [disabled]="zoneForm.invalid || monitoringState != monitoringStates.READY"
          (click)="onSubmit()"
        >
          <mat-icon class="material-symbols-outlined">save</mat-icon>
        </button>
        @if (zoneId > 0) {
          <button
            mat-icon-button
            color="warn"
            type="button"
            (click)="openDeleteDialog(zone.id)"
            [disabled]="getSensors().length > 0 || monitoringState != monitoringStates.READY"
          >
            <mat-icon class="material-symbols-outlined">delete</mat-icon>
          </button>
        }
        <button mat-icon-button color="accent" type="button" (click)="onCancel()">
          <mat-icon class="material-symbols-outlined">cancel</mat-icon>
        </button>
      </mat-card-actions>
    </mat-card>
  }

  @if (zone === null) {
    <div class="container-item">
      <h1 i18n="@@zone not found">The zone was not found!</h1>
    </div>
  }
</div>
